schema_version: 1

context:
  version: "0.3.6"

package:
  name: npmignore
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/npmignore/-/npmignore-${{ version }}.tgz
  sha256: c9f0e9e51e27417aae0d4f4ad5372776508d733349df0cae7451a2418ecc8952

build:
  number: 0
  noarch: generic

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  run:
    - nodejs

tests:
  - script:
      - npmignore --help

about:
  license: MIT
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: Command line tool for creating or updating a .npmignore file based on .gitignore
  homepage: https://github.com/ljharb/npmignore

extra:
  recipe-maintainers:
    - danielnachun
    - xhochy
